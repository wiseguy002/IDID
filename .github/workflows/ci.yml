name: CI
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: No known high-severity vulnerabilities in what ships to people
        run: npm audit --omit=dev --audit-level=high
      - name: Report any vulnerabilities in development tools (does not fail the build)
        run: npm audit || true
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Help, website, press and docs cover every feature (docs/COLLATERAL.md)
        run: node scripts/check-collateral.mjs
      - name: Install Playwright, axe-core and html-validate for the site checks
        run: npm i --no-save playwright@1 axe-core@4.10.2 html-validate@9.4.1 && npx playwright install --with-deps chromium
      - name: Build and check website (links, layout, CSP, accessibility, valid HTML)
        run: node site/tools/build-site.mjs && NODE_PATH=$PWD/node_modules node site/tools/check-site.mjs

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schema and row-level security tests (local Postgres)
        run: supabase/tests/run.sh
