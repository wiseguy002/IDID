name: CI
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main, 'mainframe/**', 'studio/**']

jobs:
  app:
    # Mainframe drafts (mainframe/<hex>, older ones studio/<hex>) change only website files: skip the app and database jobs for them.
    if: ${{ !startsWith(github.ref, 'refs/heads/studio/') && !startsWith(github.ref, 'refs/heads/mainframe/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: No known high-severity vulnerabilities in what ships to people
        run: npm audit --omit=dev --audit-level=high
      - name: Report any vulnerabilities in development tools (does not fail the build)
        run: npm audit || true
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Help, website, press and docs cover every feature (docs/COLLATERAL.md)
        run: node scripts/check-collateral.mjs
      - name: Install Playwright, axe-core and html-validate for the site checks
        run: npm i --no-save playwright@1 axe-core@4.10.2 html-validate@9.4.1 && npx playwright install --with-deps chromium
      - name: Website build tests and Mainframe markers
        run: node --test site/tools/*.test.mjs && node scripts/check-markers.mjs --profile
      - name: Build and check website (links, layout, CSP, accessibility, valid HTML)
        run: node site/tools/build-site.mjs && NODE_PATH=$PWD/node_modules node site/tools/check-site.mjs

  database:
    if: ${{ !startsWith(github.ref, 'refs/heads/studio/') && !startsWith(github.ref, 'refs/heads/mainframe/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Schema and row-level security tests (local Postgres)
        run: supabase/tests/run.sh
