name: Deploy to Cloudflare Pages
# Website → idid.care (Pages project "idid-site"); app → app.idid.care (Pages project "idid-app").
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/DEPLOY.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      # Online-circle settings (public values) come from app/.env.production.
      - name: Build
        run: npm run build
      - name: Deploy app
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          # Pinned: newer wrangler 4 releases turn `pages` commands into Workers uploads.
          wranglerVersion: '3.114.0'
          command: pages deploy dist --project-name idid-app --branch main --commit-dirty=true

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build website
        run: node tools/build-site.mjs
      - name: Deploy website
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: '3.114.0'
          command: pages deploy dist --project-name idid-site --branch main --commit-dirty=true
